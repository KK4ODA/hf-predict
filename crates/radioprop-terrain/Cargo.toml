[package]
name = "radioprop-terrain"
version = "0.1.0"
description = "Terrain for VHF and UHF paths: Copernicus elevation tiles read and kept, path profiles, clearance and Fresnel zones, ITU-R P.526 diffraction, link budgets"
authors = ["The hf-predict contributors"]
license = "MIT OR Apache-2.0"
edition = "2021"
repository = "https://github.com/KK4ODA/hf-predict"

[dependencies]
radioprop-geo = { path = "../radioprop-geo" }
flate2 = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
